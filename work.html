<style>
/* ---- 照片：网格 ⇄ 展墙 scrub 视图 ---- */
.ph-row{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; }
.view-toggle{
  position:relative;
  display:flex; align-items:center; justify-content:space-between;
  width:132px; height:30px; padding:0 8px;
  background:color-mix(in srgb, var(--white) 48%, transparent);
  backdrop-filter:blur(12px) saturate(160%); -webkit-backdrop-filter:blur(12px) saturate(160%);
  border:1px solid color-mix(in srgb, var(--white) 42%, transparent);
  border-radius:999px;
  box-shadow:0 6px 18px rgba(28,28,27,0.08), inset 0 1px 0 rgba(255,255,255,0.35);
  cursor:pointer; touch-action:none; user-select:none; outline:none;
}
.view-toggle:focus-visible .vt-thumb{ outline:1px solid var(--accent-gold); outline-offset:3px; }
.vt-label{
  position:relative; z-index:1;
  font-family:var(--font-mono); font-size:0.62rem; letter-spacing:0.1em;
  color:var(--steel); cursor:pointer; user-select:none;
  transition:color 0.25s ease;
}
.vt-label:hover{ color:var(--charcoal); }
.vt-label.on{ color:var(--accent-red); }
.vt-thumb{
  position:absolute; top:50%; margin-top:-18px; left:0;
  width:36px; height:36px; border-radius:50%;
  background:color-mix(in srgb, var(--white) 66%, transparent);
  backdrop-filter:blur(10px) saturate(150%); -webkit-backdrop-filter:blur(10px) saturate(150%);
  border:1px solid color-mix(in srgb, var(--white) 60%, transparent);
  box-shadow:0 2px 8px rgba(28,28,27,0.2), inset 0 1px 0 rgba(255,255,255,0.55);
  pointer-events:none;
  transition:background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.3s ease;
}
.vt-orbit{
  position:absolute; top:50%; left:50%; margin:-11px 0 0 -28px;
  width:56px; height:22px; border-radius:50%;
  border:1.5px solid color-mix(in srgb, var(--white) 55%, transparent);
  background:color-mix(in srgb, var(--white) 14%, transparent);
  backdrop-filter:blur(5px) saturate(140%); -webkit-backdrop-filter:blur(5px) saturate(140%);
  box-shadow:inset 0 0 6px rgba(255,255,255,0.25), 0 0 6px rgba(28,28,27,0.15);
  transform:rotate(-20deg);
  pointer-events:none;
}
.view-toggle:hover .vt-orbit, .view-toggle:active .vt-orbit{
  border-color:color-mix(in srgb, var(--accent-gold) 55%, transparent);
}
.vt-line{
  position:absolute; left:-6px; top:50%; width:48px; height:1px;
  background:linear-gradient(90deg,
    transparent 0 10%, var(--accent-gold) 10% 44%,
    transparent 44% 56%, var(--accent-gold) 56% 90%, transparent 90% 100%);
  transform:rotate(-45deg);
  pointer-events:none;
}
.vt-dot{
  position:absolute; left:7px; top:6px; width:13px; height:13px; border-radius:50%;
  border:1px solid var(--accent-red); opacity:0.85;
  transition:transform 0.25s ease;
}
.view-toggle.drag-l .vt-thumb{ transform:rotate(-13deg); }
.view-toggle.drag-r .vt-thumb{ transform:rotate(13deg); }
.view-toggle.drag-l .vt-dot{ transform:translateX(-5px); }
.view-toggle.drag-r .vt-dot{ transform:translateX(5px); }
.view-toggle:hover .vt-thumb, .view-toggle:active .vt-thumb{
  background:color-mix(in srgb, var(--accent-gold) 22%, var(--white));
  border-color:var(--accent-gold);
  box-shadow:0 2px 10px rgba(28,28,27,0.22), inset 0 1px 0 rgba(255,255,255,0.55);
}
@media (max-width:640px){
  .view-toggle{ width:118px; padding:0 8px; }
}
.gallery-wrap{ padding-bottom:140px; position:relative; }
.photo-stage{ position:relative; }
.photo-item{
  position:absolute; top:0; left:0; overflow:hidden;
  background:var(--paper-2); cursor:zoom-in;
}
.photo-item img{
  width:100%; height:100%; object-fit:cover;
  transform:scale(1.02);
  transition:transform 0.6s ease, opacity 0.5s ease;
  opacity:0;
}
.photo-item img.loaded{ opacity:1; }
.photo-item:hover img{ transform:scale(1.06); }
.photo-item .gallery-caption{
  position:absolute; left:0; right:0; bottom:0; padding:16px;
  background:linear-gradient(to top, rgba(28,28,27,0.75), transparent);
  color:var(--white); opacity:0; transform:translateY(8px);
  transition:opacity 0.4s ease, transform 0.4s ease;
}
.photo-item:hover .gallery-caption{ opacity:1; transform:translateY(0); }
.gallery-caption .cap-title{ font-family:var(--font-display); font-size:1.05rem; }
.gallery-caption .cap-meta{ font-family:var(--font-mono); font-size:0.68rem; color:var(--fog); margin-top:4px; letter-spacing:0.05em; }
.cat-head{
  position:absolute; left:0; top:0;
  font-family:var(--font-display); font-weight:500; font-size:1.4rem;
  padding-bottom:10px; border-bottom:1px solid var(--paper-2);
}
.gallery-err{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:0.72rem; color:var(--steel);
}
.lightbox{
  position:fixed; inset:0; z-index:500; background:rgba(28,28,27,0.94);
  display:flex; align-items:center; justify-content:center; padding:50px;
  cursor:zoom-out;
  opacity:0; visibility:hidden;
  transition:opacity 0.25s ease, visibility 0s linear 0.25s;
}
.lightbox.active{ opacity:1; visibility:visible; transition:opacity 0.25s ease; }
.lightbox-stage{
  position:relative; display:flex; flex-direction:column; align-items:center;
  max-width:100%; max-height:100%; margin:0;
}
.lightbox-stage img{ max-width:88vw; max-height:76vh; object-fit:contain; filter:none; transition:opacity 0.18s ease; }
.lightbox-stage img.swap{ opacity:0; }
.lightbox-caption{ margin-top:18px; text-align:center; color:var(--white); }
.lightbox-caption .cap-title{ font-family:var(--font-display); font-size:1.02rem; letter-spacing:0.02em; }
.lightbox-caption .cap-meta{
  margin-top:5px; font-family:var(--font-mono); font-size:0.68rem;
  letter-spacing:0.1em; color:rgba(250,247,240,0.6);
}
.lightbox-count{
  position:fixed; top:32px; left:50%; transform:translateX(-50%);
  font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.14em;
  color:rgba(250,247,240,0.7);
}
.lightbox-nav{
  position:fixed; top:50%; transform:translateY(-50%);
  width:48px; height:48px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.32); background:transparent;
  color:var(--white); font-family:var(--font-mono); font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
}
.lightbox-nav:hover{ border-color:var(--accent-gold); color:var(--accent-gold); background:rgba(255,255,255,0.06); }
.lb-prev{ left:30px; }
.lb-next{ right:30px; }
.lightbox-close{
  position:fixed; top:26px; right:32px; z-index:501;
  font-family:var(--font-mono); font-size:0.75rem; color:var(--white);
  border:1px solid rgba(255,255,255,0.3); padding:8px 14px; cursor:pointer;
  background:transparent;
}
.lightbox-close:hover{ border-color:var(--accent-gold); color:var(--accent-gold); }
@media (max-width:640px){
  .lightbox{ padding:20px; }
  .lightbox-stage img{ max-width:92vw; max-height:70vh; }
  .lightbox-nav{ width:40px; height:40px; }
  .lb-prev{ left:8px; }
  .lb-next{ right:8px; }
}
</style>

<script>
(function(){
  var stage = document.getElementById('photo-stage');
  var toggle = document.getElementById('view-toggle');
  var thumb = toggle.querySelector('.vt-thumb');
  var gridLabel = document.getElementById('vt-grid-label');
  var wallLabel = document.getElementById('vt-wall-label');
  var photos = [], cats = [], groups = {}, globalOf = {};
  var imgSizes = [];
  var items = [], headEls = [];
  var layouts = null;
  var state = { p: 0, raf: null, ready: false };

  function esc(s){ var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
  function lerp(a, b, t){ return a + (b - a) * t; }

  function colsFor(W){
    if(W >= 860) return 4;
    if(W >= 600) return 3;
    if(W >= 380) return 2;
    return 1;
  }

  function computeLayouts(){
    var W = stage.clientWidth;
    var gapG = 18, gapW = 14;
    var cols = colsFor(W);
    var gw = (W - gapG * (cols - 1)) / cols;
    var gH = gw * 0.75;
    var ww = (W - gapW * (cols - 1)) / cols;
    var grid = [], wall = [];
    var headPos = [];
    var gy = 0;
    cats.forEach(function(cat){
      var list = groups[cat];
      headPos.push({ y: gy });
      gy += 46;
      var rows = Math.ceil(list.length / cols);
      for(var r = 0; r < rows; r++){
        for(var c = 0; c < cols; c++){
          var j = r * cols + c;
          if(j >= list.length) break;
          var gi = globalOf[list[j].id];
          grid[gi] = { x: c * (gw + gapG), y: gy + r * (gH + gapG), w: gw, h: gH };
        }
      }
      gy += rows * (gH + gapG);
    });
    var colH = new Array(cols).fill(0);
    photos.forEach(function(p, i){
      var size = imgSizes[i] || { w: 4, h: 3 };
      var hh = ww / (size.w / size.h);
      var c = colH.indexOf(Math.min.apply(null, colH));
      wall[i] = { x: c * (ww + gapW), y: colH[c], w: ww, h: hh };
      colH[c] += hh + gapW;
    });
    layouts = {
      grid: grid, wall: wall, heads: headPos,
      h: Math.max(gy, Math.max.apply(null, colH) - gapW)
    };
  }

  function render(p){
    if(!layouts) return;
    stage.style.height = layouts.h + 'px';
    items.forEach(function(it, i){
      var g = layouts.grid[i], wl = layouts.wall[i];
      it.style.left = lerp(g.x, wl.x, p) + 'px';
      it.style.top = lerp(g.y, wl.y, p) + 'px';
      it.style.width = lerp(g.w, wl.w, p) + 'px';
      it.style.height = lerp(g.h, wl.h, p) + 'px';
      it.style.filter = 'grayscale(' + (1 - p).toFixed(3) + ')';
    });
    headEls.forEach(function(el, i){
      var hp = layouts.heads[i];
      if(!hp) return;
      el.style.top = hp.y + 'px';
      el.style.opacity = (1 - p).toFixed(3);
      el.style.transform = 'translateY(' + (-12 * p).toFixed(1) + 'px)';
    });
    gridLabel.classList.toggle('on', p < 0.02);
    wallLabel.classList.toggle('on', p > 0.98);
  }

  function setP(p){
    state.p = Math.max(0, Math.min(1, p));
    render(state.p);
    thumb.style.left = lerp(gridLabel.offsetLeft + gridLabel.offsetWidth / 2, wallLabel.offsetLeft + wallLabel.offsetWidth / 2, state.p) + 'px';
    toggle.setAttribute('aria-valuenow', Math.round(state.p * 100));
  }
  function animateTo(target){
    if(state.raf) cancelAnimationFrame(state.raf);
    var start = state.p, t0 = performance.now(), dur = 900;
    function step(now){
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      setP(start + (target - start) * e);
      if(t < 1) state.raf = requestAnimationFrame(step);
    }
    state.raf = requestAnimationFrame(step);
  }
  function pFromEvent(e){
    var rect = toggle.getBoundingClientRect();
    var x1 = gridLabel.offsetLeft + gridLabel.offsetWidth / 2;
    var x2 = wallLabel.offsetLeft + wallLabel.offsetWidth / 2;
    return Math.max(0, Math.min(1, (e.clientX - rect.left - x1) / (x2 - x1)));
  }

  var dragging = false, lastX = null;
  toggle.addEventListener('pointerdown', function(e){
    dragging = true;
    lastX = e.clientX;
    if(state.raf) cancelAnimationFrame(state.raf);
    setP(pFromEvent(e));
    toggle.setPointerCapture(e.pointerId);
  });
  toggle.addEventListener('pointermove', function(e){
    if(dragging){
      setP(pFromEvent(e));
      if(lastX !== null){
        var dx = e.clientX - lastX;
        lastX = e.clientX;
        if(Math.abs(dx) > 0.5){
          toggle.classList.remove('drag-l', 'drag-r');
          toggle.classList.add(dx > 0 ? 'drag-r' : 'drag-l');
        }
      }
    }
  });
  toggle.addEventListener('pointerup', function(){ dragging = false; lastX = null; toggle.classList.remove('drag-l', 'drag-r'); });
  toggle.addEventListener('pointercancel', function(){ dragging = false; lastX = null; toggle.classList.remove('drag-l', 'drag-r'); });
  gridLabel.addEventListener('click', function(){ animateTo(0); });
  wallLabel.addEventListener('click', function(){ animateTo(1); });
  toggle.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft'){ setP(state.p - 0.05); e.preventDefault(); }
    else if(e.key === 'ArrowRight'){ setP(state.p + 0.05); e.preventDefault(); }
    else if(e.key === 'Home'){ animateTo(0); }
    else if(e.key === 'End'){ animateTo(1); }
  });

  fetch('photos/photos.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || data.length === 0){
        stage.innerHTML = '<div class="empty-state">还没有照片</div>';
        return;
      }
      photos = data;
      groups = {};
      photos.forEach(function(p){
        var cat = p.category || '未分类';
        if(!groups[cat]) groups[cat] = [];
        groups[cat].push(p);
      });
      cats = Object.keys(groups);
      photos.forEach(function(p, i){ globalOf[p.id] = i; });

      var ready = 0;
      function onSize(i, w, h){
        imgSizes[i] = { w: w, h: h };
        ready++;
        if(ready === photos.length) build();
      }
      photos.forEach(function(p, i){
        var im = new Image();
        im.onload = function(){ onSize(i, im.naturalWidth, im.naturalHeight); };
        im.onerror = function(){ onSize(i, 4, 3); };
        im.src = p.image;
      });
    })
    .catch(function(){
      stage.innerHTML = '<div class="empty-state">照片加载失败，检查 photos/photos.json 是否存在。</div>';
    });

  function build(){
    stage.innerHTML = photos.map(function(p, i){
      return '<div class="photo-item" data-i="' + i + '">' +
        '<img src="' + esc(p.image) + '" alt="' + esc(p.title) + '">' +
        '<div class="gallery-caption"><div class="cap-title">' + esc(p.title) + '</div><div class="cap-meta">' + esc(p.date) + '</div></div>' +
        '</div>';
    }).join('');
    items = [].slice.call(stage.querySelectorAll('.photo-item'));
    items.forEach(function(it){
      var img = it.querySelector('img');
      img.onload = function(){ img.classList.add('loaded'); };
      img.onerror = function(){
        img.classList.add('loaded');
        var msg = document.createElement('div');
        msg.className = 'gallery-err';
        msg.textContent = '图片加载失败';
        it.appendChild(msg);
      };
    });
    stage.insertAdjacentHTML('beforeend', cats.map(function(c){
      return '<div class="cat-head">' + esc(c) + '</div>';
    }).join(''));
    headEls = [].slice.call(stage.querySelectorAll('.cat-head'));

    window.__photos = { list: photos };

    var saved = localStorage.getItem('workView');
    var q = new URLSearchParams(window.location.search).get('view');
    if(q !== null && !isNaN(parseFloat(q))){
      state.p = Math.max(0, Math.min(1, parseFloat(q)));
    } else {
      state.p = saved === 'wall' ? 1 : 0;
    }

    computeLayouts();
    setP(state.p);
    state.ready = true;
  }

  var rT;
  window.addEventListener('resize', function(){
    clearTimeout(rT);
    rT = setTimeout(function(){
      if(state.ready){
        computeLayouts();
        setP(state.p);
      }
    }, 150);
  });
})();
(function(){
  var lightbox = document.getElementById('lightbox');
  var stage = document.getElementById('lb-stage');
  var countEl = document.getElementById('lb-count');
  var img = document.createElement('img');
  img.alt = '';
  stage.appendChild(img);
  var caption = document.createElement('figcaption');
  caption.className = 'lightbox-caption';
  caption.innerHTML = '<div class="cap-title"></div><div class="cap-meta"></div>';
  stage.appendChild(caption);
  var titleEl = caption.querySelector('.cap-title');
  var metaEl = caption.querySelector('.cap-meta');

  var list = [], current = 0, cache = {};

  function preload(i){
    if(!list.length) return;
    var a = list[(i + 1) % list.length];
    var b = list[(i - 1 + list.length) % list.length];
    [a, b].forEach(function(p){
      if(p && !cache[p.image]){ cache[p.image] = 1; var im = new Image(); im.src = p.image; }
    });
  }
  function render(index){
    if(!list.length) return;
    current = (index + list.length) % list.length;
    var p = list[current];
    countEl.textContent = (current + 1) + ' / ' + list.length;
    titleEl.textContent = p.title || '';
    metaEl.textContent = [p.date, p.category].filter(Boolean).join(' · ');
    preload(current);
    if(img.getAttribute('src') === p.image){ img.classList.remove('swap'); return; }
    img.classList.add('swap');
    var proxy = new Image();
    proxy.onload = function(){
      img.src = p.image;
      img.alt = p.title || '';
      img.classList.remove('swap');
    };
    proxy.onerror = function(){
      img.classList.remove('swap');
      metaEl.textContent = (metaEl.textContent ? metaEl.textContent + ' · ' : '') + '图片加载失败';
    };
    proxy.src = p.image;
  }
  function open(index){
    if(!window.__photos || !window.__photos.list.length) return;
    list = window.__photos.list;
    document.body.style.overflow = 'hidden';
    lightbox.classList.add('active');
    render(index);
  }
  function close(){
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }
  function next(){ render(current + 1); }
  function prev(){ render(current - 1); }

  document.addEventListener('click', function(e){
    var item = e.target.closest('.photo-item');
    if(item){ open(parseInt(item.getAttribute('data-i'), 10)); return; }
    if(e.target.closest('.lb-prev')){ prev(); return; }
    if(e.target.closest('.lb-next')){ next(); return; }
    if(e.target.closest('.lightbox-close')){ close(); return; }
    if(lightbox.classList.contains('active') && e.target === lightbox){ close(); }
  });
  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('active')) return;
    if(e.key === 'Escape') close();
    else if(e.key === 'ArrowLeft') prev();
    else if(e.key === 'ArrowRight') next();
  });
  var startX = null;
  stage.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, { passive:true });
  stage.addEventListener('touchend', function(e){
    if(startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 40){ dx < 0 ? next() : prev(); }
    startX = null;
  }, { passive:true });
})();
</script>
