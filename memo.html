<script>
(function(){
  var listEl = document.getElementById('memo-list');
  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = String(s == null ? '' : s);
    return d.innerHTML;
  }
  fetch('memos.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(memos){
      if(!memos || memos.length === 0){
        listEl.innerHTML = '<div class="empty-state">还没有随记，敬请期待。</div>';
        return;
      }
      memos = memos.slice().sort(function(a,b){
        return String(b.date || '').localeCompare(String(a.date || ''));
      });
      listEl.innerHTML = memos.map(function(m){
        var body = '';
        if(m.text){ body += '<div class="memo-text">' + escapeHtml(m.text) + '</div>'; }
        if(m.image){ body += '<img class="memo-img" src="' + escapeHtml(m.image) + '" alt="' + escapeHtml(m.text || '随记') + '">'; }
        if(m.linkUrl){ body += '<a class="memo-link" href="' + escapeHtml(m.linkUrl) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(m.linkTitle || m.linkUrl) + ' ↗</a>'; }
        return '<div class="memo-item"><span class="memo-date">' + escapeHtml(m.date || '') + '</span><div class="memo-body">' + body + '</div></div>';
      }).join('');
    })
    .catch(function(){
      listEl.innerHTML = '<div class="empty-state">随记加载失败，检查 memos.json 是否存在。</div>';
    });
})();
</script>
